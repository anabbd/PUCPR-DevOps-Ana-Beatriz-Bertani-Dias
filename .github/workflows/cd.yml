name: CD

# Continuous Delivery: apos passar nos testes, empacota a aplicacao em um
# artefato pronto para deploy e o publica no proprio GitHub Actions.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build e empacotamento
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Rodar testes (gate de qualidade)
        run: pytest -q

      - name: Empacotar aplicacao
        run: |
          mkdir -p dist
          tar --exclude='__pycache__' -czf dist/api-tarefas.tar.gz app requirements.txt README.md
          echo "Artefato gerado:"
          ls -lh dist

      - name: Publicar artefato de deploy
        uses: actions/upload-artifact@v4
        with:
          name: api-tarefas
          path: dist/api-tarefas.tar.gz
          retention-days: 7
